name: gold-gap-bot

on:
  schedule:
    # Every 5 minutes around the clock (public repo: unlimited minutes)
    # keep-alive round: 2026-08-30 20:10Z (re-register scheduler)
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: goldgap
  # ملاحظة 2026-09-15: كانت false وسبّبت وقفاً دائماً — دورة عالقة في
  # "queued" احتكرت قفل المجموعة فاصطفّت خلفها كل الدورات اللاحقة
  # وأُلغيت (توقف البوت من 21:20). الآن true: أي دورة جديدة تنتزع من
  # الدورة العالقة/المعلّقة وتنطلق — السلسلة لا تموت أبداً. التداخل
  # الحقيقي يتجنّبه أصلاً حارس overlap في خطوة Self-dispatch أدناه.
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        run: python live.py
        env:
          CBOT_APP_CLIENT_ID: ${{ secrets.CBOT_APP_CLIENT_ID }}
          CBOT_APP_CLIENT_SECRET: ${{ secrets.CBOT_APP_CLIENT_SECRET }}
          CBOT_ACCESS_TOKEN: ${{ secrets.CBOT_ACCESS_TOKEN }}
          CBOT_REFRESH_TOKEN: ${{ secrets.CBOT_REFRESH_TOKEN }}
          CBOT_MODE: ${{ secrets.CBOT_MODE }}
          CBOT_ENVIRONMENT: ${{ secrets.CBOT_ENVIRONMENT }}
          CBOT_DURATION_MIN: "3.0"
          CBOT_TOKEN_SYNC: "1"
          GH_TOKEN: ${{ secrets.DISPATCH_PAT }}
          # 2026-09-23 الوضع الهجومي (طلب صريح: صفقات كثيرة بنقاط دخول
          # قوية): عتبة 1.20 + تهدئة 1 د + لا تخطي إشارة + لا انصراف بائع
          # + تقزيم تذبذب العتبة. طبقات الجودة (تأكيد الدورتين/التوافق
          # الاتجاهي/تغطية التكلفة/حارس السبريد) تبقى دائماً كما هي.
          # لإعادتها لأي قيمة سابقاً: عدّل هذه الأسطر فقط.
          STRAT_COOLDOWN_MIN: "1.0"
          STRAT_MOMENTUM_MIN: "1.20"
          STRAT_HUMAN_SKIP: "0"
          STRAT_HUMAN_AWAY: "0"
          STRAT_HUMAN_ENTRY_JITTER: "0.03"
          STRAT_FEES_PER_LOT: ${{ secrets.STRAT_FEES_PER_LOT }}
          STRAT_PROFIT_FLOOR: ${{ secrets.STRAT_PROFIT_FLOOR }}
          STRAT_PROFIT_FLOOR_LOT: ${{ secrets.STRAT_PROFIT_FLOOR_LOT }}
          STRAT_TRAILING_ARM: ${{ secrets.STRAT_TRAILING_ARM }}
          STRAT_TRAILING_BACK: ${{ secrets.STRAT_TRAILING_BACK }}
          STRAT_MAX_HOLD_HOURS: ${{ secrets.STRAT_MAX_HOLD_HOURS }}
          STRAT_MAX_LOSS_USD: ${{ secrets.STRAT_MAX_LOSS_USD }}
          STRAT_PROFIT_TARGET: ${{ secrets.STRAT_PROFIT_TARGET }}
          STRAT_Z_ENTRY: ${{ secrets.STRAT_Z_ENTRY }}
          STRAT_Z_EXIT: ${{ secrets.STRAT_Z_EXIT }}
          STRAT_MIN_GAP: ${{ secrets.STRAT_MIN_GAP }}
          STRAT_MAX_ENTRY_GAP: ${{ secrets.STRAT_MAX_ENTRY_GAP }}
          STRAT_MAX_DAILY_LOSS_USD: ${{ secrets.STRAT_MAX_DAILY_LOSS_USD }}
          STRAT_MAX_CONSEC_LOSSES: ${{ secrets.STRAT_MAX_CONSEC_LOSSES }}
          STRAT_MAX_TRADES_PER_DAY: ${{ secrets.STRAT_MAX_TRADES_PER_DAY }}
          # 2026-09-23 إعادة البناء: إيقاف الفتح افتراضياً (راقب فقط) حتى
          # تسليم v2 — يُعاد التداول بوضع المتغير (Actions variable):
          #   STRAT_PAUSE_OPEN=0 في إعدادات الريبو (Settings→Variables).
          # 2026-09-25 (طلب صريح: الخسائر «الدائمة» من نافذة السوق السامة):
          # تفعيل حاجز الجلسة المقيّدة SESSION_BLOCK [16:00–22:00 UTC] —
          # كود الحارس موجود أصلاً (in_quality_session) وكان متوقفاً
          # افتراضياً. تحليل سجل الحي (493 صفقة بالمخطط الحالي): حجب
          # [16,22) يرفع المحصلة من -144.89 إلى -76.27 مع بقاء ساعة 22
          # المربحة (+59.48) حرة. العكس عبر STRAT_SESSION_BLOCK_ON=0.
          STRAT_MODEL: ${{ vars.STRAT_MODEL || 'v1' }}
          STRAT_PAUSE_OPEN: ${{ vars.STRAT_PAUSE_OPEN || '1' }}
          STRAT_V2_EVAL: ${{ vars.STRAT_V2_EVAL || '1' }}
          STRAT_SESSION_BLOCK_ON: "1"
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"

      - name: Persist gap log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: gold gap log update ($(date -u +%FT%TZ))"
          git push || { git pull --rebase --autostash origin main; git push; }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Self-dispatch (keep chain alive)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "DISPATCH_PAT not set; relying on cron schedule only"
            exit 0
          fi
          ACTIVE=$(
            gh api "repos/${{ github.repository }}/actions/runs?per_page=20" \
              --jq '[.workflow_runs[] | select(.status == "in_progress" or .status == "queued") | .id]' \
              2>/dev/null | tr -d '[]'
          )
          OTHER=$(printf '%s\n' "$ACTIVE" | sed '/^$/d' | grep -vx "$GITHUB_RUN_ID" || true)
          if [ -z "$OTHER" ]; then
            echo "no overlapping run -> dispatching next"
            for i in 1 2 3; do
              if gh workflow run goldgap.yml --ref "${{ github.ref_name }}" 2>/dev/null; then
                echo "self-dispatch attempt $i OK"
                break
              fi
              echo "self-dispatch attempt $i failed, retrying"
              sleep 6
            done
          else
            echo "overlap detected ($OTHER); skipping self-dispatch"
          fi