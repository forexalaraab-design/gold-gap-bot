name: gold-gap-mt5

on:
  schedule:
    # دورة قصيرة كل 5 دقائق — رانسات عامة مجانية غير محدودة
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      probe:
        description: "فحص تمهيدي اتصال/رمز/سبريد بلا صفقات (MT5_PROBE=1)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: goldgap-mt5
  cancel-in-progress: true

jobs:
  run-mt5:
    runs-on: windows-latest
    timeout-minutes: 14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MetaTrader5 python package
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install MetaTrader5
          python -m pip install -r requirements.txt

      # تيرمنال Fusion الرسمي — مُثبّت الوسيط نفسه وسيرفرات FusionMarkets
      # مسبقة القائمة. سبب اختياره: على التثبيت العام (MetaQuotes) بلا
      # حساب ولا سيرفر معلوم، توقف التيرمنال عند شاشة أول تشغيل فلا
      # يجيب IPC أبداً (7 تشغيلات فشلت بـ -10005). jأجوبة موثوقة
      # (stackoverflow 75687231) تؤكد أن تنزيل تيرمنال الوسيط هو الحل
      # لأن سيرفره يكون مكتشفاً سلفاً. الرابط من صفحة Fusion الرسمية:
      #   download.terminal.free/cdn/web/fusion.markets.pty/mt5/fusionmarkets5setup.exe
      - name: Install Fusion MT5 terminal
        shell: pwsh
        run: |
          $setup = "C:\mt5setup.exe"
          $url = "https://download.terminal.free/cdn/web/fusion.markets.pty/mt5/fusionmarkets5setup.exe"
          Write-Host "downloading Fusion MT5 installer..."
          Invoke-WebRequest -Uri $url -OutFile $setup -UseBasicParsing
          Write-Host "size=$((Get-Item $setup).Length) bytes"
          Write-Host "installing (silent /auto /portable)..."
          $p = Start-Process -FilePath $setup -ArgumentList "/auto", "/portable" -PassThru -Wait
          Write-Host "mt5setup exit=$($p.ExitCode)"
          $candidates = @(
            "C:\Program Files\Fusion Markets MetaTrader 5\terminal64.exe",
            "C:\Program Files\Fusion Markets MT5\terminal64.exe",
            "C:\Program Files\MetaTrader 5\terminal64.exe",
            "C:\Program Files\MetaTrader 5 Terminal\terminal64.exe",
            (Join-Path $env:LOCALAPPDATA "MetaTrader 5\terminal64.exe")
          )
          $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($found) {
            Write-Host "MT5 terminal at $found"
            "MT5_TERMINAL_PATH=$found" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
            "MT5_PORTABLE=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          } else {
            Write-Host "::error::terminal64.exe not found in common paths"
          }

      - name: Run MT5 bot (short cycle)
        shell: pwsh
        run: |
          # الوصفة الموثقة (Joaopeuko/Mql5-Python-Integration):
          #   1) إقلاع portable بلا وسائط دخول وبدون واجهة (/headless) — فلا
          #      يوجد نافذة/حوار يعلّق IPC على الـ runner.
          #   2) initialize(path, portable=True) يلتحق بالترمنال القائم.
          #   3) تسجيل الدخول عبر login(login,password,server) صريحة —
          #      لا عبر حقن Password في common.ini (يتجاهله MT5 الحديث
          #      المشفّر ولا تصل إلى الحساب في portable).
          $found = $env:MT5_TERMINAL_PATH
          if ($found -and (Test-Path $found)) {
            Start-Process -FilePath $found -ArgumentList @(
              "/portable", "/headless", "/config:config", "/noreport"
            )
            Write-Host "terminal booted (portable/headless)"
            $deadline = (Get-Date).AddSeconds(60)
            $seen = $false
            while ((Get-Date) -lt $deadline) {
              if (Get-Process terminal64 -ErrorAction SilentlyContinue) {
                $seen = $true; break
              }
              Start-Sleep -Seconds 5
            }
            if ($seen) {
              Write-Host "terminal64 process detected"
            } else {
              Write-Host "::error::terminal64 didn't start within 60s"
            }
            # حقن [Experts] في config بجانب التيرمنال (وضع portable يضع
            # config بجوار الملف لا في %APPDATA%). إدخال لا تغيير سلوك.
            try {
              $exeDir = Split-Path $found
              $cfgPathCandidates = @(
                (Join-Path $exeDir "config\common.ini"),
                (Join-Path $exeDir "Config\common.ini")
              )
              foreach ($cp in $cfgPathCandidates) {
                if (Test-Path $cp) {
                  $c = Get-Content $cp -Raw -ErrorAction SilentlyContinue
                  if ($c -notmatch '\[Experts\]') {
                    Add-Content -Path $cp -Value @("", "[Experts]",
                      "Enabled=1", "AllowDllImport=1", "Account=0",
                      "Profile=0", "Chart=0", "Api=0", "DisableOpenCL=0",
                      "WebRequest=0", "")
                    Write-Host "injected [Experts] into $cp"
                  } else {
                    Write-Host "[Experts] already present in $cp"
                  }
                  break
                }
              }
            } catch { Write-Host "expert inject skipped: $($_.Exception.Message)" }
            Start-Sleep -Seconds 25
          } else {
            Write-Host "no MT5_TERMINAL_PATH — relying on initialize default"
          }
          python live_mt5.py
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MT5_PORTABLE: "1"
          MT5_SYMBOL: ${{ vars.MT5_SYMBOL || 'XAUUSD' }}
          MT5_DURATION_MIN: ${{ vars.MT5_DURATION_MIN || '3.0' }}
          MT5_PROBE: ${{ inputs.probe && '1' || '0' }}
          # نفس قواعد v1 الحي (هجومي 1.20 + بلا فلتر إضافي + لوت 0.01)
          STRAT_COOLDOWN_MIN: "1.0"
          STRAT_MOMENTUM_MIN: "1.20"
          STRAT_HUMAN_SKIP: "0"
          STRAT_HUMAN_AWAY: "0"
          STRAT_HUMAN_ENTRY_JITTER: "0.03"
          STRAT_FEES_PER_LOT: ${{ secrets.STRAT_FEES_PER_LOT }}
          STRAT_TRAILING_ARM: ${{ secrets.STRAT_TRAILING_ARM }}
          STRAT_TRAILING_BACK: ${{ secrets.STRAT_TRAILING_BACK }}
          STRAT_MAX_HOLD_HOURS: ${{ secrets.STRAT_MAX_HOLD_HOURS }}
          STRAT_MAX_LOSS_USD: ${{ secrets.STRAT_MAX_LOSS_USD }}
          STRAT_PROFIT_TARGET: ${{ secrets.STRAT_PROFIT_TARGET }}
          STRAT_MODEL: ${{ vars.STRAT_MODEL || 'v1' }}
          STRAT_PAUSE_OPEN: ${{ vars.STRAT_PAUSE_OPEN || '1' }}
          STRAT_V2_EVAL: ${{ vars.STRAT_V2_EVAL || '1' }}
          # فلتر الوقت (جلسة 16–22 UTC) معطّل مؤقتاً بإذن المستخدم للتحقق
          # لاكتشاف سلاسل الأعطال؛ يُعاد تفعيله عبر ضبط المتغير =1.
          STRAT_SESSION_BLOCK_ON: ${{ vars.STRAT_SESSION_BLOCK_ON || '0' }}
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"

      - name: Persist state
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $no = git add data/ 2>&1; if ($LASTEXITCODE -ne 0) { Write-Host "data/ ignored or empty: $no"; exit 0 }
          $none = git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "no changes"; exit 0 }
          git commit -m "data: mt5 log update ($(Get-Date -Format o))"
          git push
          if ($LASTEXITCODE -ne 0) { git pull --rebase --autostash origin main; git push }

      - name: Self-dispatch (keep mt5 chain alive)
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_PAT }}
        run: |
          if (-not $env:GH_TOKEN) { Write-Host "no DISPATCH_PAT — cron only"; exit 0 }
          $runs = gh api "repos/${{ github.repository }}/actions/runs?per_page=20" `
            --jq '[.workflow_runs[] | select(.status == "in_progress" or .status == "queued") | .id]'
          $other = ($runs | Where-Object { $_ -ne "$env:GITHUB_RUN_ID" })
          if (-not $other) {
            Write-Host "no overlap -> dispatch next mt5 round"
            gh workflow run mt5.yml --ref $env:GITHUB_REF_NAME
          } else {
            Write-Host "overlap detected ($other); skipping self-dispatch"
          }