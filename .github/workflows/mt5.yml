name: gold-gap-mt5

on:
  schedule:
    # دورة قصيرة كل 5 دقائق — رانسات عامة مجانية غير محدودة
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      probe:
        description: "فحص تمهيدي اتصال/رمز/سبريد بلا صفقات (MT5_PROBE=1)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: goldgap-mt5
  cancel-in-progress: true

jobs:
  run-mt5:
    runs-on: windows-latest
    timeout-minutes: 14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MetaTrader5 python package
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install MetaTrader5
          python -m pip install -r requirements.txt

      # تيرمنال MT5 رسمي (MetaQuotes) — يعمل مع أي وسيط عبر
      # login/password/server. تثبيت صامت ثم نبحث عن terminal64.exe في
      # المواضع الشائعة ونضبط MT5_TERMINAL_PATH ليمرِّره initialize.
      # الرابط الرسمي المؤكد من mql5.com (team.metaquotes):
      #   download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe
      - name: Install MT5 terminal
        shell: pwsh
        run: |
          $setup = "C:\mt5setup.exe"
          $url = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          Write-Host "downloading MT5 web-installer from mql5 CDN..."
          Invoke-WebRequest -Uri $url -OutFile $setup -UseBasicParsing
          Write-Host "installing MT5 (silent /auto)..."
          $p = Start-Process -FilePath $setup -ArgumentList "/auto" -PassThru -Wait
          Write-Host "mt5setup exit=$($p.ExitCode)"
          $candidates = @(
            "C:\Program Files\MetaTrader 5\terminal64.exe",
            "C:\Program Files\MetaTrader 5 Terminal\terminal64.exe",
            (Join-Path $env:LOCALAPPDATA "MetaTrader 5\terminal64.exe"),
            (Join-Path $env:APPDATA "MetaQuotes\Terminal\terminal64.exe")
          )
          $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($found) {
            Write-Host "MT5 terminal at $found"
            "MT5_TERMINAL_PATH=$found" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          } else {
            Write-Host "terminal64.exe not found in common paths — initialize path will be null"
          }

      - name: Run MT5 bot (short cycle)
        shell: pwsh
        run: |
          # نفس الخطوة: إعداد config كاملاً (حساب + [Experts]) ثم إقلاع
          # صامت بلا حوار ثم initialize. على headless runner يجب أن يبدأ
          # التيرمنال بحساب مخزّن مسبقاً — لا بتمرير وسوم دخول تُظهر نافذة.
          $found = $env:MT5_TERMINAL_PATH
          $login = "${{ secrets.MT5_LOGIN }}"
          $pass  = "${{ secrets.MT5_PASSWORD }}"
          $serv  = "${{ secrets.MT5_SERVER }}"
          # 1) حقن [Common] (حساب) و [Experts] (تداول آلي) في common.ini
          $cfg = Get-ChildItem "$env:APPDATA\MetaQuotes\Terminal" -Recurse `
            -Filter common.ini -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($cfg) {
            Write-Host "config at $($cfg.FullName)"
            # بناءً على الأسطر (لا regex) كي لا يتأثر '$' في كلمة السر
            $lines = Get-Content $cfg.FullName
            $common = @()
            $seenLogin = $false; $seenServer = $false; $seenPass = $false
            foreach ($ln in $lines) {
              if ($ln -like 'Login=*') { $common += "Login=$login"; $seenLogin = $true }
              elseif ($ln -like 'Server=*') { $common += "Server=$serv"; $seenServer = $true }
              elseif ($ln -like 'Password=*') { $common += "Password=$pass"; $seenPass = $true }
              else { $common += $ln }
            }
            if (-not $seenLogin) { $common += "Login=$login" }
            if (-not $seenServer) { $common += "Server=$serv" }
            if (-not $seenPass) { $common += "Password=$pass" }
            # نطبع فقط مفتاح وجود الحساب لا كلمة السر
            Write-Host "common: login=$login server=$serv password=***"
            if (($common | Out-String) -notmatch '\[Experts\]') {
              $common += ''
              $common += '[Experts]'
              $common += 'Enabled=1'
              $common += 'AllowDllImport=1'
              $common += 'Account=0'
              $common += 'Profile=0'
              $common += 'Chart=0'
              $common += 'Api=0'
              $common += 'DisableOpenCL=0'
              $common += 'WebRequest=0'
            }
            [System.IO.File]::WriteAllLines($cfg.FullName, $common, [System.Text.Encoding]::UTF8)
            Write-Host "injected [Common] login/server/password + [Experts] Enabled=1"
          } else {
            Write-Host "warning: no common.ini found — cannot preconfigure account"
          }
          # 2) إقلاع التيرمنال صامتاً (بلا وسوم دخول) — سيقرأ الحساب من config
          if ($found -and (Test-Path $found)) {
            # إقلاع أولي قصير: يُنشئ مجلد بيانات التيرمنال (config\common.ini)
            # في %APPDATA%\MetaQuotes\Terminal\<hash>\config. ثم نقتله ونحقن
            # الاعتمادات ليتسجّل دخولاً صامتاً عند الإقلاع الثاني.
            $boot = Start-Process -FilePath $found -PassThru
            Write-Host "boot#1 pid=$($boot.Id) (create data dir + config)"
            Start-Sleep -Seconds 20
            Stop-Process -Id $boot.Id -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 3
            $cfg = $null
            foreach ($base in @("$env:APPDATA\MetaQuotes\Terminal",
                                "$env:LOCALAPPDATA\MetaQuotes\Terminal",
                                "$env:APPDATA\MetaQuotes")) {
              $cfg = Get-ChildItem $base -Recurse -Filter common.ini `
                -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($cfg) { break }
            }
            if (-not $cfg) {
              Write-Host "::error::common.ini not found after boot#1"
              Write-Host "TERMINAL DIR TREE:"
              Get-ChildItem "$env:APPDATA\MetaQuotes" -Recurse -Depth 2 `
                -ErrorAction SilentlyContinue | Select-Object -First 60 FullName
            } else {
              Write-Host "config at $($cfg.FullName)"
              $lines = Get-Content $cfg.FullName -ErrorAction SilentlyContinue
              $common = @()
              $seenLogin = $false; $seenServer = $false; $seenPass = $false
              foreach ($ln in $lines) {
                if ($ln -like 'Login=*') { $common += "Login=$login"; $seenLogin = $true }
                elseif ($ln -like 'Server=*') { $common += "Server=$serv"; $seenServer = $true }
                elseif ($ln -like 'Password=*') { $common += "Password=$pass"; $seenPass = $true }
                else { $common += $ln }
              }
              if (-not $seenLogin) { $common += "Login=$login" }
              if (-not $seenServer) { $common += "Server=$serv" }
              if (-not $seenPass) { $common += "Password=$pass" }
              Write-Host "common: login=$login server=$serv password=***"
              if (($common | Out-String) -notmatch '\[Experts\]') {
                $common += ''
                $common += '[Experts]'
                $common += 'Enabled=1'
                $common += 'AllowDllImport=1'
                $common += 'Account=0'
                $common += 'Profile=0'
                $common += 'Chart=0'
                $common += 'Api=0'
                $common += 'DisableOpenCL=0'
                $common += 'WebRequest=0'
              }
              [System.IO.File]::WriteAllLines($cfg.FullName, $common, [System.Text.Encoding]::UTF8)
              Write-Host "injected [Common] login/server/password + [Experts] Enabled=1"
            }
            # إقلاع ثانٍ صامت: يقرأ الاعتمادات من config — لا حوارات.
            $boot2 = Start-Process -FilePath $found -PassThru
            Write-Host "boot#2 pid=$($boot2.Id) (silent login from config)"
            Start-Sleep -Seconds 30
          } else {
            Write-Host "no MT5_TERMINAL_PATH — relying on initialize default"
          }
          # 3) تشغيل البوت — initialize ستلتحق بالترمنال المقلع
          python live_mt5.py
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MT5_SYMBOL: ${{ vars.MT5_SYMBOL || 'XAUUSD' }}
          MT5_DURATION_MIN: ${{ vars.MT5_DURATION_MIN || '3.0' }}
          MT5_PROBE: ${{ inputs.probe && '1' || '0' }}
          # نفس قواعد v1 الحي (هجومي 1.20 + بلا فلتر إضافي + لوت 0.01)
          STRAT_COOLDOWN_MIN: "1.0"
          STRAT_MOMENTUM_MIN: "1.20"
          STRAT_HUMAN_SKIP: "0"
          STRAT_HUMAN_AWAY: "0"
          STRAT_HUMAN_ENTRY_JITTER: "0.03"
          STRAT_FEES_PER_LOT: ${{ secrets.STRAT_FEES_PER_LOT }}
          STRAT_TRAILING_ARM: ${{ secrets.STRAT_TRAILING_ARM }}
          STRAT_TRAILING_BACK: ${{ secrets.STRAT_TRAILING_BACK }}
          STRAT_MAX_HOLD_HOURS: ${{ secrets.STRAT_MAX_HOLD_HOURS }}
          STRAT_MAX_LOSS_USD: ${{ secrets.STRAT_MAX_LOSS_USD }}
          STRAT_PROFIT_TARGET: ${{ secrets.STRAT_PROFIT_TARGET }}
          STRAT_MODEL: ${{ vars.STRAT_MODEL || 'v1' }}
          STRAT_PAUSE_OPEN: ${{ vars.STRAT_PAUSE_OPEN || '1' }}
          STRAT_V2_EVAL: ${{ vars.STRAT_V2_EVAL || '1' }}
          STRAT_SESSION_BLOCK_ON: "1"
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"

      - name: Persist state
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $no = git add data/ 2>&1; if ($LASTEXITCODE -ne 0) { Write-Host "data/ ignored or empty: $no"; exit 0 }
          $none = git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "no changes"; exit 0 }
          git commit -m "data: mt5 log update ($(Get-Date -Format o))"
          git push
          if ($LASTEXITCODE -ne 0) { git pull --rebase --autostash origin main; git push }

      - name: Self-dispatch (keep mt5 chain alive)
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_PAT }}
        run: |
          if (-not $env:GH_TOKEN) { Write-Host "no DISPATCH_PAT — cron only"; exit 0 }
          $runs = gh api "repos/${{ github.repository }}/actions/runs?per_page=20" `
            --jq '[.workflow_runs[] | select(.status == "in_progress" or .status == "queued") | .id]'
          $other = ($runs | Where-Object { $_ -ne "$env:GITHUB_RUN_ID" })
          if (-not $other) {
            Write-Host "no overlap -> dispatch next mt5 round"
            gh workflow run mt5.yml --ref $env:GITHUB_REF_NAME
          } else {
            Write-Host "overlap detected ($other); skipping self-dispatch"
          }