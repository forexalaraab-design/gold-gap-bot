name: Multi-Pair Daily Bot — Cloud MT5

on:
  schedule:
    - cron: "0 6,12,18 * * *"   # 3 جولات يومياً — بلا سلسلة self-dispatch
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: multi-bot
  cancel-in-progress: false

jobs:
  run-multi-bot:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install MetaTrader5
          python -m pip install -r requirements_multi.txt

      - name: Install Fusion MT5 terminal
        shell: pwsh
        run: |
          $setup = "C:\mt5setup.exe"
          $url = "https://download.terminal.free/cdn/web/fusion.markets.pty/mt5/fusionmarkets5setup.exe"
          Write-Host "downloading Fusion MT5 installer..."
          Invoke-WebRequest -Uri $url -OutFile $setup -UseBasicParsing
          Write-Host "size=$((Get-Item $setup).Length) bytes"
          Write-Host "installing (silent /auto /portable)..."
          $p = Start-Process -FilePath $setup -ArgumentList "/auto", "/portable" -PassThru -Wait
          Write-Host "mt5setup exit=$($p.ExitCode)"
          $candidates = @(
            "C:\Program Files\Fusion Markets MetaTrader 5\terminal64.exe",
            "C:\Program Files\Fusion Markets MT5\terminal64.exe",
            "C:\Program Files\MetaTrader 5\terminal64.exe",
            "C:\Program Files\MetaTrader 5 Terminal\terminal64.exe",
            (Join-Path $env:LOCALAPPDATA "MetaTrader 5\terminal64.exe")
          )
          $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($found) {
            Write-Host "MT5 terminal at $found"
            "MT5_TERMINAL_PATH=$found" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
            "MT5_PORTABLE=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          } else {
            Write-Host "::error::terminal64.exe not found in common paths"
          }

      - name: Run multi-pair bot
        shell: pwsh
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MT5_PORTABLE: "1"
          MULTI_BROKER: mt5
          MULTI_SCAN_HOUR: "8"
          MULTI_SCAN_MINUTE: "0"
          MULTI_MIN_CONFIDENCE: "0.30"
          MULTI_MAX_TRADES: "1"
          MULTI_RISK_PCT: "0.01"
          MULTI_AI_ON: "0"
          # 2026-10-29: التنفيذ مطفأ افتراضياً. حتى لو فُتح، بوابة 300$ تمنع.
          MULTI_EXECUTE: "0"
          MULTI_MIN_EQUITY: "300"
          # فحص جاف: يمرّر الطلب على مدقق الوسيط (order_check) ولا يرسله أبداً.
          MULTI_DRY_RUN: "1"
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"
        run: |
          $found = $env:MT5_TERMINAL_PATH
          if ($found -and (Test-Path $found)) {
            try {
              $exeDir = Split-Path $found
              $cfgDir = Join-Path $exeDir "config"
              New-Item -ItemType Directory -Path $cfgDir -Force | Out-Null
              $cfgPath = Join-Path $cfgDir "common.ini"
              $wrote = @()
              if (Test-Path $cfgPath) {
                $c = Get-Content $cfgPath -Raw -ErrorAction SilentlyContinue
                if ($c -notmatch '\[Experts\]') { $wrote += $c }
              }
              if ($wrote.Count -gt 0) {
                Set-Content -Path $cfgPath -Value ($wrote -join "`n") -Encoding ascii
              }
              Add-Content -Path $cfgPath -Value @("", "[Experts]", "Enabled=1", "AllowDllImport=1", "Account=0", "Profile=0", "Chart=0", "Api=0", "DisableOpenCL=0", "WebRequest=0", "")
              Write-Host "[Experts] written to $cfgPath"
            } catch {
              Write-Host "expert pre-inject skipped: $($_.Exception.Message)"
            }
            Start-Process -FilePath $found -ArgumentList @("/portable", "/headless", "/config:config", "/noreport")
            Write-Host "terminal booted (portable/headless)"
            $deadline = (Get-Date).AddSeconds(60)
            $seen = $false
            while ((Get-Date) -lt $deadline) {
              if (Get-Process terminal64 -ErrorAction SilentlyContinue) {
                $seen = $true; break
              }
              Start-Sleep -Seconds 5
            }
            if ($seen) {
              Write-Host "terminal64 process detected"
            } else {
              Write-Host "::error::terminal64 didn't start within 60s"
            }
            Start-Sleep -Seconds 25
          } else {
            Write-Host "no MT5_TERMINAL_PATH — relying on initialize default"
          }
          python main_multi.py

      - name: Persist state
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B main
          function Save-State([int]$attempt) {
            git add data/ 2>&1 | Out-Null
            git diff --cached --quiet
            if ($LASTEXITCODE -eq 0) { Write-Host "no data changes (attempt $attempt)"; return $true }
            git commit -m "data: mt5 log update ($(Get-Date -Format o))" | Out-Null
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) { Write-Host "pushed data (attempt $attempt)"; return $true }
            Copy-Item -Recurse -Force data "$env:RUNNER_TEMP\data_backup_$attempt"
            git fetch origin main
            git reset --hard origin/main
            Copy-Item -Recurse -Force "$env:RUNNER_TEMP\data_backup_$attempt\*" data\
            return $false
          }
          $ok = Save-State 1
          if (-not $ok) { $ok = Save-State 2 }
          if (-not $ok) { $ok = Save-State 3 }
          if (-not $ok) { Write-Host "::warning::persist failed after 3 attempts"; exit 0 }
          Write-Host "persist OK"

      - name: Upload run logs (4-week evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-run-${{ github.run_number }}
          path: |
            data/scan_reasons.json
            data/opportunities.json
            data/dry_run.json
            data/multi_trades.csv
            data/multi_state.json
          if-no-files-found: warn
          retention-days: 14
