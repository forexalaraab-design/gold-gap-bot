name: watchdog

on:
  schedule:
    # ظٹظپط­طµ ظƒظ„ 20 ط¯ظ‚ظٹظ‚ط© â€” ط£ظˆط³ط¹ ظ…ظ† ط³ظ„ط³ظ„ط© ط§ظ„ط¨ظˆطھ (~3.5ط¯) ظپظ„ط§ ظٹطھط¹ط§ط±ط¶طŒ
    # ظˆظٹطھط¯ط®ظ„ ظپظ‚ط· ط¥ط°ط§ طµظ…طھ ط§ظ„ط¨ظˆطھ ط£ظƒط«ط± ظ…ظ† ط§ظ„ط­ط¯ (15 ط¯ظ‚ظٹظ‚ط© ط§ظپطھط±ط§ط¶ظٹط§ظ‹).
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      max_silence_min:
        description: "ط£ظ‚طµظ‰ طµظ…طھ (ط¯ظ‚ط§ط¦ظ‚) ظ‚ط¨ظ„ ط¥ط¹ط§ط¯ط© ط§ظ„ط¥ط·ظ„ط§ظ‚" 
        required: false
        default: "15"

concurrency:
  group: watchdog
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Detect silence and re-dispatch bot
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_PAT }}
        run: |
          MAX="${{ github.event.inputs.max_silence_min }}"
          if [ -z "$MAX" ]; then MAX=15; fi
          if [ -z "$GH_TOKEN" ]; then
            echo "DISPATCH_PAT not set; watchdog is read-only, relying on cron only"
            exit 0
          fi
          NOW=$(date +%s)
          LAST=$(
            gh api "repos/${{ github.repository }}/commits?path=data/&per_page=1" \
              --jq '.[0].commit.committer.date' 2>/dev/null
          )
          if [ -z "$LAST" ] || [ "$LAST" = "null" ]; then
            echo "no data commits found -> treating chain as dead"
            TS=0
          else
            TS=$(date -d "$LAST" +%s)
          fi
          AGE=$(( (NOW - TS) / 60 ))
          if [ "$AGE" -lt 0 ]; then AGE=0; fi
          echo "last_data_commit_min_ago=$AGE max_silence_min=$MAX"
          if [ "$AGE" -le "$MAX" ]; then
            echo "bot alive ($AGE min <= $MAX) â€” nothing to do"
            exit 0
          fi
          echo "BOT SILENT for $AGE min (> $MAX) â€” re-dispatching"
          for i in 1 2 3; do
            if gh workflow run mt5.yml --ref main 2>/dev/null; then
              echo "re-dispatch OK on attempt $i; chain healed automatically"
              exit 0
            fi
            echo "re-dispatch attempt $i failed, retrying"
            sleep 8
          done
          echo "re-dispatch FAILED after 3 attempts â€” manual intervention required"
          exit 1